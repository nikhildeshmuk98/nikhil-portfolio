<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Stack Projects | Nikhil Dandolu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06101a;--emerald:#2e8b57;--mint:#6fcf97;--gold:#d9bc82;--gold-deep:#a98a4d;
  --text:#d9e2de;--muted:#9fb1aa;--white:#fff;--glass:rgba(12,46,36,.38);
  --line:rgba(217,188,130,.18);--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(46,139,87,.22),transparent 60%),
    radial-gradient(900px 500px at -10% 40%,rgba(217,188,130,.08),transparent 60%),
    linear-gradient(160deg,var(--ink) 0%,#08201a 55%,var(--ink) 100%);
  background-attachment:fixed;
}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:1100;transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,var(--emerald),var(--gold),var(--mint));box-shadow:0 0 12px rgba(217,188,130,.7)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;will-change:transform}
.orb.a{width:380px;height:380px;background:rgba(46,139,87,.28);top:8%;left:-120px}
.orb.b{width:320px;height:320px;background:rgba(217,188,130,.14);bottom:6%;right:-100px}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:.9rem 5%;background:rgba(6,16,26,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);transition:padding .4s var(--ease),background .4s}
.nav.scrolled{padding:.55rem 5%;background:rgba(6,16,26,.82)}
.back{justify-self:start;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--gold);font-size:1rem;transition:all .4s var(--ease)}
.back:hover{background:var(--gold);color:var(--ink);transform:translateX(-4px);box-shadow:0 0 22px rgba(217,188,130,.45)}
.nav-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:var(--white);letter-spacing:.04em}

.container{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:8rem 2rem 5rem}

/* Hero */
.hero{text-align:center;margin-bottom:4rem}
.avatar{position:relative;width:208px;height:208px;margin:0 auto 2rem;border-radius:50%;padding:5px;
  background:conic-gradient(from 0deg,var(--gold),var(--emerald),var(--gold-deep),var(--mint),var(--gold));
  animation:spin 9s linear infinite;box-shadow:0 0 50px rgba(46,139,87,.45)}
.avatar::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid var(--ink);display:block;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.socials{display:flex;justify-content:center;gap:1rem;margin-bottom:2.4rem}
.social{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;color:var(--text);
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);transition:all .45s var(--ease)}
.social:hover{transform:translateY(-6px) scale(1.06);color:#fff;border-color:transparent;box-shadow:0 12px 24px rgba(0,0,0,.35)}
.social.github:hover{background:#2b3137}
.social.linkedin:hover{background:#0a75b5}
.social.whatsapp:hover{background:#22c15e}
.social.instagram:hover{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.hero h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.4rem,5.5vw,4rem);line-height:1.1;color:var(--white)}
.hero h2 span{background:linear-gradient(100deg,var(--gold),#f3e3bd 50%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:1rem auto 0;max-width:540px;color:var(--muted);font-weight:300;line-height:1.7}
.rule{width:110px;height:2px;margin:1.6rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero>*{opacity:0;transform:translateY(26px);animation:rise 1s var(--ease) forwards}
.hero>*:nth-child(2){animation-delay:.12s}.hero>*:nth-child(3){animation-delay:.24s}
.hero>*:nth-child(4){animation-delay:.34s}.hero>*:nth-child(5){animation-delay:.44s}
@keyframes rise{to{opacity:1;transform:none}}

/* Grid: every card identical, any count stays centered */
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2rem;align-items:stretch}
.card{--mx:50%;--my:50%;
  flex:0 1 calc((100% - 4rem) / 3);min-width:0;
  position:relative;display:flex;flex-direction:column;padding:1.1rem 1.1rem 1.5rem;border-radius:22px;
  background:linear-gradient(160deg,rgba(16,60,47,.5),rgba(8,26,24,.62));
  border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 40px rgba(0,0,0,.28);
  opacity:0;transform:translateY(60px) scale(.96);filter:blur(6px);
  transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease),border-color .5s,box-shadow .5s}
.card.in{opacity:1;transform:none;filter:blur(0)}
.card.in.ready{transition:transform .25s ease-out,border-color .5s,box-shadow .5s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(217,188,130,.16),transparent 55%)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(260px circle at var(--mx) var(--my),var(--gold),transparent 65%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:hover{box-shadow:0 30px 60px rgba(0,0,0,.42),0 0 40px rgba(46,139,87,.18)}
.card:hover::before,.card:hover::after{opacity:1}

.thumb{position:relative;height:210px;border-radius:15px;overflow:hidden;margin-bottom:1.4rem;border:1px solid var(--line);background:#0b1f1a;
  display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(6,16,26,.65));pointer-events:none}
.card:hover .thumb img{transform:scale(1.08)}
.thumb .ph{font-size:3rem;color:var(--gold);opacity:.55}
.badge{position:absolute;top:12px;left:12px;z-index:2;padding:.3rem .8rem;border-radius:30px;font-size:.72rem;font-weight:500;letter-spacing:.04em;
  color:var(--ink);background:linear-gradient(120deg,#f1deb0,var(--gold));box-shadow:0 4px 12px rgba(0,0,0,.3)}

.body{display:flex;flex-direction:column;flex:1;padding:0 .5rem}
.title{font-family:'Cormorant Garamond',serif;font-size:1.75rem;line-height:1.2;font-weight:700;color:var(--white);min-height:2.4em;display:flex;align-items:flex-start}
.desc{margin-top:.7rem;font-size:.92rem;line-height:1.75;font-weight:300;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:7em}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0 1.6rem;min-height:4.2rem;align-content:flex-start}
.tag{padding:.28rem .85rem;border-radius:30px;font-size:.76rem;font-weight:500;letter-spacing:.03em;height:fit-content;
  color:var(--gold);background:rgba(217,188,130,.07);border:1px solid rgba(217,188,130,.28)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:auto}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:.55rem;padding:.8rem 1rem;
  border-radius:50px;font-size:.88rem;font-weight:500;letter-spacing:.03em;transition:all .45s var(--ease)}
.btn i{transition:transform .45s var(--ease)}
.btn.ghost{color:var(--text);border:1px solid rgba(217,188,130,.35);background:rgba(255,255,255,.02)}
.btn.ghost:hover{color:var(--gold);border-color:var(--gold);background:rgba(217,188,130,.1);transform:translateY(-4px)}
.btn.solid{color:var(--ink);font-weight:600;background:linear-gradient(120deg,#f1deb0,var(--gold) 50%,var(--gold-deep));
  box-shadow:0 8px 20px rgba(217,188,130,.2);border:1px solid transparent}
.btn.solid::before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);transition:left .8s var(--ease)}
.btn.solid:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(217,188,130,.38)}
.btn.solid:hover::before{left:140%}
.btn.solid:hover i{transform:translate(3px,-3px)}
.btn.off{opacity:.45;pointer-events:none}

footer{position:relative;z-index:1;text-align:center;padding:2rem 1rem 3rem;color:var(--muted);font-size:.85rem;font-weight:300}

@media(max-width:1024px){.card{flex-basis:calc((100% - 2rem) / 2)}}
@media(max-width:680px){
  .container{padding:6.5rem 1.1rem 3rem}
  .card{flex-basis:100%}
  .avatar{width:168px;height:168px}
  .thumb{height:190px}
  .nav-title{font-size:1.35rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card,.hero>*{opacity:1!important;transform:none!important;filter:none!important}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="orb a" data-speed="0.08"></div>
<div class="orb b" data-speed="-0.06"></div>

<nav class="nav" id="nav">
  <a class="back" href="home.html" aria-label="Back to home"><i class="fas fa-arrow-left"></i></a>
  <h1 class="nav-title">Full Stack Projects</h1>
  <div></div>
</nav>

<main class="container">
  <section class="hero">
    <div class="avatar"><img src="images/nikhildeshmuk.png" alt="Nikhil Dandolu"></div>
    <div class="socials">
      <a href="https://github.com/nikhildeshmuk98" class="social github" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/nikhil-dandolu-429aa6407/" class="social linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="https://wa.me/916309872249" class="social whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.instagram.com/nikhil_deshmuk_14" class="social instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    </div>
    <h2>Full Stack <span>Projects</span></h2>
    <p>Complete applications with a frontend, a backend and a database, built end to end.</p>
    <div class="rule"></div>
  </section>

  <section class="grid" id="grid"></section>
</main>

<footer>&copy; <span id="yr"></span> Nikhil Dandolu. Crafted with care.</footer>

<script>
/* ============================================================
   ADD YOUR PROJECTS HERE
   Copy one block, edit it, and the card appears automatically.
   All cards are rendered with identical size and layout.
   ============================================================ */
var PROJECTS = [
  {
    title: "RYTHU CONNECT: AI-POWERED AGRICULTURAL MANAGEMENT AND FARMER CONNECTIVITY WEB APPLICATION",
    image: "images/rythu connect profile.jpg",
    badge: "Full Stack",
    desc: "Rythu Connect is a full-stack agriculture web application developed using python Flask, MySQL, HTML, CSS, and JavaScript to connect farmers with modern agricultural services. It provides features like an AI assistant, weather updates, agricultreal marketplace, farming jobs, government schemes, farmer community, networking, and analytics. The main goal of Rythu Connect is to empower farmers with digital technology, improve access to agricultural information, and help them make smarter farming decisions.",
    tags: ["HTML5", "CSS3", "JavaScript", "Flask", "MySQL"],
    github: "https://github.com/nikhildeshmuk98/rythuconnect.git",
    demo: "https://rythuconnect.onrender.com/"
  },
  {
    title: "DEEPFLIX: AI-POWERED MOVIE AND OTT RECOMMENDATION SYSTEM USING NLP AND CNN",
    image: "images/deeplix.png",
    badge: "AI / Full Stack",
    desc: "DEEPFLIX is an AI-powered movie and OTT recommendation web application developed using Python, Flask, MySQL, NLP, and CNN. It uses script analysis, sentiment analysis, and a hybrid recommendation engine to provide personalized movie suggestions. The platform includes movie browsing, ratings, user preferences, and viewing progress tracking, helping users discover relevant movies through intelligent recommendations.",
    tags: ["HTML5", "CSS3", "JavaScript", "Python", "Flask", "MySQL", "NLP", "CNN", "TensorFlow"],
    github: "https://github.com/nikhildeshmuk98/deepflix.git",
    demo: "https://deepflix-fpd0.onrender.com/"
},
  {
    title: "Your Next Project",
    image: "",
    badge: "Coming Soon",
    desc: "A new full stack build is on the way. Replace this card in the PROJECTS list with your next project's title, image, description and links.",
    tags: ["Frontend", "Backend", "Database"],
    github: "",
    demo: ""
  }
];

(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var grid = document.getElementById('grid');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  PROJECTS.forEach(function(p){
    var live = p.demo && p.github;
    var thumb = p.image
      ? '<img src="' + esc(p.image) + '" alt="' + esc(p.title) + '" loading="lazy">'
      : '<i class="fas fa-layer-group ph"></i>';
    var ghBtn = p.github
      ? '<a href="' + esc(p.github) + '" class="btn ghost" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> GitHub</a>'
      : '<span class="btn ghost off"><i class="fab fa-github"></i> GitHub</span>';
    var demoBtn = p.demo
      ? '<a href="' + esc(p.demo) + '" class="btn solid" target="_blank" rel="noopener noreferrer"><i class="fas fa-arrow-up-right-from-square"></i> Live Demo</a>'
      : '<span class="btn solid off"><i class="fas fa-arrow-up-right-from-square"></i> Live Demo</span>';
    var el = document.createElement('article');
    el.className = 'card';
    el.innerHTML =
      '<div class="thumb">' + (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') + thumb + '</div>' +
      '<div class="body">' +
        '<h3 class="title">' + esc(p.title) + '</h3>' +
        '<p class="desc">' + esc(p.desc) + '</p>' +
        '<div class="tags">' + p.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="actions">' + ghBtn + demoBtn + '</div>' +
      '</div>';
    grid.appendChild(el);
  });

  var nav = document.getElementById('nav');
  var bar = document.getElementById('progress');
  var orbs = document.querySelectorAll('.orb');
  document.getElementById('yr').textContent = new Date().getFullYear();

  var ticking = false;
  function onScroll(){
    var y = window.scrollY;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.transform = 'scaleX(' + (max > 0 ? y / max : 0) + ')';
    nav.classList.toggle('scrolled', y > 30);
    if(!reduce){ orbs.forEach(function(o){ o.style.transform = 'translateY(' + (y * parseFloat(o.dataset.speed)) + 'px)'; }); }
    ticking = false;
  }
  window.addEventListener('scroll', function(){ if(!ticking){ requestAnimationFrame(onScroll); ticking = true; } }, {passive:true});
  onScroll();

  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var el = e.target;
      var cols = window.innerWidth > 1024 ? 3 : window.innerWidth > 680 ? 2 : 1;
      var col = cards.indexOf(el) % cols;
      el.style.transitionDelay = (col * 130) + 'ms';
      el.classList.add('in');
      setTimeout(function(){ el.style.transitionDelay = '0ms'; el.classList.add('ready'); }, 1100 + col * 130);
      io.unobserve(el);
    });
  }, {threshold:0.12, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });

  if(!reduce && window.matchMedia('(hover: hover)').matches){
    cards.forEach(function(card){
      card.addEventListener('mousemove', function(ev){
        var r = card.getBoundingClientRect();
        var x = ev.clientX - r.left, y = ev.clientY - r.top;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
        if(card.classList.contains('ready')){
          card.style.transform = 'perspective(900px) rotateX(' + (((y / r.height) - .5) * -6) + 'deg) rotateY(' + (((x / r.width) - .5) * 6) + 'deg) translateY(-10px)';
        }
      });
      card.addEventListener('mouseleave', function(){ if(card.classList.contains('ready')) card.style.transform = ''; });
    });
  }
})();
</script>
</body>
</html>
